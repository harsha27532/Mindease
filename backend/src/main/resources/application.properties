spring.application.name=mindease-backend
server.port=${PORT:8080}

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/mindease?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# JWT Configuration (minimum 256 bits secret)
mindease.jwt.secret=${JWT_SECRET:mindease-super-secret-jwt-key-for-signing-tokens-must-be-at-least-256-bits-long!}
mindease.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# Default Admin Account Initialization (Only created if not already present)
mindease.admin.email=${ADMIN_EMAIL:admin@mindease.com}
mindease.admin.password=${ADMIN_PASSWORD:Admin@12345}
mindease.admin.name=${ADMIN_NAME:MindEase Administrator}
